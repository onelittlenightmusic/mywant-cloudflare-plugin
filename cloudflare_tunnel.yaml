wantType:
  metadata:
    name: cloudflare
    labels:
      # What the robot reads a request against, when it asks Laya which want
      # it is: the type in a few words of its own (laya-option).
      laya-option: "Cloudflareトンネルでポートを公開する"
      aliases: "cloudflare,tunnel,トンネル"
    title: Cloudflare Tunnel
    description: |
      Exposes a local service via a public URL using Cloudflare Tunnel (cloudflared).
      Starts cloudflared in the background, waits for the Quick Tunnel URL to appear in its output,
      and stores it in state as `tunnel_url` (also exposed as `final_result`).
      Since result_field defaults to "tunnel_url", the URL is also auto-persisted
      into ~/.mywant/config.yaml's tunnel_url field — see storeLaunchResultURL in
      mywant/engine/types/agent_launch_manager.go.

      Requirements:
        - cloudflared must be installed and available in PATH
    version: "1.0"
    category: tunnel
    pattern: independent

  parameters:
    - name: port
      description: Local port to expose
      type: string
      subType: port
      default: "8081"
    - name: args
      description: CLI arguments as JSON array (overrides port if set)
      type: string
      default: '["tunnel", "--url", "http://localhost:8081"]'
    - name: command
      description: Path to cloudflared binary
      type: string
      default: "cloudflared"
    - name: url_regex
      description: Regex to extract the tunnel URL from logs
      type: string
      default: '\|\s+(https://[a-zA-Z0-9-]+\.trycloudflare\.com)\s+'
    - name: max_retries
      description: Max retries waiting for the tunnel URL
      type: int
      default: 40
    - name: log_file
      description: Path to capture cloudflared output (auto-generated if empty)
      type: string
      default: ""
    - name: result_field
      description: |
        State field to store the captured URL in. Defaults to "tunnel_url", which
        the engine auto-persists into ~/.mywant/config.yaml's tunnel_url field
        once captured (see storeLaunchResultURL). Override to "server_url" (or
        anything else) to opt out of that auto-persistence.
      type: string
      default: "tunnel_url"

  requires:
    - live_server_management

  finalResultField: tunnel_url

  # When it tells of its answer, besides the standard timing "answer": restarted: its process came up again.
  timings:
    - name: restarted
      irregular: true   # out of the ordinary: the robot looks at it
      requires: [notify]   # what it needs done (met by a capability that attends to it)
      description: プロセスが起動し直したとき（落ちて復帰した）
      icon: rotate-ccw
      onChange: process_pid
      murmur: true
      notify: true

  onInitialize:
    params:
      process_command: command
      process_args: args
      process_log_file: log_file
      url_regex: url_regex
      result_field: result_field
      max_retries: max_retries
    plan:
      process_plan: "start"
    executeAgents: true

  onDelete:
    plan:
      process_plan: "stop"
    executeAgents: true

  achievedWhen:
    field: process_status
    operator: "=="
    value: "running"

  state:
    - name: process_pid
      type: int
      label: current
      persistent: true
      initialValue: 0
    - name: process_status
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: process_log_file
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: process_command
      type: string
      label: current
      persistent: false
      initialValue: ""
    - name: process_args
      type: string
      label: current
      persistent: false
      initialValue: ""
    - name: process_plan
      type: string
      label: plan
      persistent: false
      initialValue: ""
    - name: url_regex
      type: string
      label: current
      persistent: false
      initialValue: ""
    - name: result_field
      type: string
      label: current
      persistent: false
      initialValue: ""
    - name: max_retries
      type: int
      label: current
      persistent: false
      initialValue: 0
    - name: server_url
      description: Extracted tunnel URL (populated only if result_field is overridden to "server_url")
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: tunnel_url
      description: Extracted tunnel URL (default result_field target) — mirrors config.yaml's tunnel_url once persisted
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: error_message
      type: string
      label: current
      persistent: true
      initialValue: ""

  # How a want of this type is asked for, in words, and what it is made with
  # (want-spec asks): what reads requests (the robot, Laya) learns from these
  # and is tested on them. A parameter left out is one the request does not say.
  asks:
    - say: "cloudflareで8081を公開して"
      variants: ["Cloudflareトンネルで8081を公開", "8081をcloudflareで外に出して", "cloudflareのトンネルで8081番ポート"]
      params: {"port": "8081"}
